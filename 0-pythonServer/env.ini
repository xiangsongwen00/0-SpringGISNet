[server]
host = 0.0.0.0
# 后端 API 使用独立端口；前端通过各自的环境变量配置 API 地址。
port = 8080
environment = development
access_log = false

[database]
config_path = data/postgis.json

[security]
access_token_minutes = 15
refresh_token_days = 30
secret_key_file = data/server_secret.key

[cors]
# 同域部署或仅供原生 APK 调用时保持为空。
# 只有浏览器前端与 API 不同源时，才填写真实的 HTTPS 前端来源，多个来源用逗号分隔。
# 示例：origins = https://www.example.com,https://admin.example.com
origins =

[geocoding]
# 高德 Web 服务 Key 单独保存在被 Git 忽略的文件中，不写入可提交配置。
amap_web_service_key =
amap_web_service_key_file = data/amap_web_service.key

